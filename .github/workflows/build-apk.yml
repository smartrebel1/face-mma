name: Build Face MMA APK

on:
  workflow_dispatch:
  push:
    paths:
      - "work/android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "ndk;27.2.12479018"

      - name: Download matching upstream native runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/face-mma-native/arm64-v8a"
          curl -fL --retry 3 \
            "https://github.com/AbrahamPaulJ/facefusion-mobile/releases/download/v0.9.41/facefusion-mobile-0.9.41-release.apk" \
            -o "$RUNNER_TEMP/upstream.apk"
          unzip -Z1 "$RUNNER_TEMP/upstream.apk" | grep '^lib/arm64-v8a/.*\.so$' > "$RUNNER_TEMP/native-files.txt"
          test -s "$RUNNER_TEMP/native-files.txt"
          while IFS= read -r entry; do
            unzip -p "$RUNNER_TEMP/upstream.apk" "$entry" > "$RUNNER_TEMP/face-mma-native/arm64-v8a/${entry##*/}"
          done < "$RUNNER_TEMP/native-files.txt"
          test -s "$RUNNER_TEMP/face-mma-native/arm64-v8a/libffnative.so"
          echo "Staged native libraries:"
          ls -lh "$RUNNER_TEMP/face-mma-native/arm64-v8a"

      - name: Build debug APK
        working-directory: work/android
        shell: bash
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew --no-daemon :app:assembleDebug -PprebuiltNativeDir="$RUNNER_TEMP/face-mma-native" 2>&1 | tee "$RUNNER_TEMP/assemble.log"
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            grep -E 'e: |FAILURE:|What went wrong|Caused by:|Execution failed' "$RUNNER_TEMP/assemble.log" | head -n 25 | while IFS= read -r line; do
              echo "::error title=AssembleDebug::${line}"
            done
            exit $rc
          fi

      - name: Run unit tests
        working-directory: work/android
        shell: bash
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew --no-daemon :app:testDebugUnitTest -PprebuiltNativeDir="$RUNNER_TEMP/face-mma-native" --info 2>&1 | tee "$RUNNER_TEMP/test.log"
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            grep -E 'FAILED|Exception|AssertionError|e: |What went wrong|Caused by:' "$RUNNER_TEMP/test.log" | head -n 25 | while IFS= read -r line; do
              echo "::error title=UnitTest::${line}"
            done
            exit $rc
          fi

      - name: Find and verify APK
        run: |
          set -euo pipefail
          echo "APK outputs found:"
          find work/android -type f -path '*/build/outputs/apk/*/*.apk' -print
          APK="$(find work/android -type f -path '*/build/outputs/apk/*/*.apk' -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" "$RUNNER_TEMP/face-mma-debug.apk"
          sha256sum "$RUNNER_TEMP/face-mma-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-mma-debug-apk
          path: ${{ runner.temp }}/face-mma-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Debug APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          TIMESTAMP="$(date -u +%Y%m%d-%H%M%S)"
          TAG="ci-apk-${TIMESTAMP}-${SHORT_SHA}"
          SHA256="$(sha256sum "$RUNNER_TEMP/face-mma-debug.apk" | awk '{print $1}')"
          NOTES="Automated Debug APK build for Android Virtual Webcam & Live Stream Video Player (commit ${GITHUB_SHA}, branch ${GITHUB_REF_NAME}).\n\nSHA256: \`${SHA256}\`"
          gh release create "$TAG" "$RUNNER_TEMP/face-mma-debug.apk" \
            --title "Virtual Webcam & Live Stream Studio APK (${TAG})" \
            --notes "$(printf '%b' "$NOTES")"
