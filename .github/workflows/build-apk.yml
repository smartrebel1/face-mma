name: Build Face MMA APK

on:
  workflow_dispatch:
  push:
    paths:
      - "work/android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "ndk;27.2.12479018"

      - name: Download documented upstream native runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/face-mma-native/arm64-v8a"
          curl -fL --retry 3 \
            "https://github.com/AbrahamPaulJ/facefusion-mobile/releases/download/v0.9.0/facefusion-mobile-0.9.0-release.apk" \
            -o "$RUNNER_TEMP/upstream.apk"
          unzip -Z1 "$RUNNER_TEMP/upstream.apk" | grep '^lib/arm64-v8a/.*\.so$' > "$RUNNER_TEMP/native-files.txt"
          test -s "$RUNNER_TEMP/native-files.txt"
          while IFS= read -r entry; do
            unzip -p "$RUNNER_TEMP/upstream.apk" "$entry" > "$RUNNER_TEMP/face-mma-native/arm64-v8a/${entry##*/}"
          done < "$RUNNER_TEMP/native-files.txt"
          test -s "$RUNNER_TEMP/face-mma-native/arm64-v8a/libffnative.so"
          echo "Staged native libraries:"
          ls -lh "$RUNNER_TEMP/face-mma-native/arm64-v8a"

      - name: Build debug APK
        working-directory: work/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug -PprebuiltNativeDir="$RUNNER_TEMP/face-mma-native"

      - name: Verify APK exists
        run: |
          set -euo pipefail
          APK="work/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-mma-debug-apk
          path: work/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
