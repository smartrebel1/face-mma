name: Build SCAN APK

on:
  workflow_dispatch:
  push:
    paths:
      - "scan/**"
      - "!scan/dist/**"
      - ".github/workflows/build-scan-apk.yml"

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: scan
        run: |-
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -n 40

      - name: Publish build log if the build failed
        if: steps.build.outcome == 'failure'
        run: |-
          set -euo pipefail
          mkdir -p scan/dist
          grep -E "e: file|error:|FAILURE:|What went wrong|Caused by|> Task .* FAILED" "$RUNNER_TEMP/build.log" | head -n 200 > scan/dist/build-errors.txt || true
          tail -n 6000 "$RUNNER_TEMP/build.log" > scan/dist/build.log || true
          git config user.name "scan-ci"
          git config user.email "scan-ci@users.noreply.github.com"
          git add -f scan/dist/build.log scan/dist/build-errors.txt
          git diff --cached --quiet && exit 0
          git commit -m "ci: capture SCAN build errors [skip ci]"
          for i in 1 2 3; do git push origin "HEAD:${GITHUB_REF_NAME}" && break || sleep 4; done

      - name: Publish APK if the build passed
        if: steps.build.outcome == 'success'
        run: |-
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' scan/app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          echo "SCAN version: $VERSION"
          APK="$(find scan -path '*outputs/apk/debug/*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          mkdir -p scan/dist
          find scan/dist -maxdepth 1 -name 'SCAN-*-debug.apk' ! -name "SCAN-${VERSION}-debug.apk" -delete || true
          cp "$APK" "scan/dist/SCAN-${VERSION}-debug.apk"
          rm -f scan/dist/scan-app-debug.apk scan/dist/build.log scan/dist/build-errors.txt || true
          sha256sum "scan/dist/SCAN-${VERSION}-debug.apk" > scan/dist/sha256.txt
          cat scan/dist/sha256.txt
          git config user.name "scan-ci"
          git config user.email "scan-ci@users.noreply.github.com"
          git rm -f --cached --ignore-unmatch scan/dist/build.log scan/dist/build-errors.txt scan/dist/scan-app-debug.apk >/dev/null 2>&1 || true
          git add -A scan/dist
          git add -f "scan/dist/SCAN-${VERSION}-debug.apk"
          git diff --cached --quiet && exit 0
          git commit -m "ci: publish SCAN ${VERSION} debug APK [skip ci]"
          for i in 1 2 3; do git push origin "HEAD:${GITHUB_REF_NAME}" && break || sleep 4; done

      - name: Lint
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: scan
        run: ./gradlew --no-daemon :app:lintDebug || true

      - name: Publish lint summary
        if: steps.build.outcome == 'success'
        run: |-
          set -euo pipefail
          python3 scan/tools/lint_summary.py > scan/dist/lint.txt 2>&1 || echo "lint summary failed" > scan/dist/lint.txt
          git config user.name "scan-ci"
          git config user.email "scan-ci@users.noreply.github.com"
          git add -f scan/dist/lint.txt
          git diff --cached --quiet && exit 0
          git commit -m "ci: publish lint summary [skip ci]"
          for i in 1 2 3; do git push origin "HEAD:${GITHUB_REF_NAME}" && break || sleep 4; done

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SCAN-debug-apk
          path: scan/dist/SCAN-*-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach the APK to a GitHub release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' scan/app/build.gradle.kts | head -n 1)"
          APK="scan/dist/SCAN-${VERSION}-debug.apk"
          test -s "$APK"
          TAG="scan-apk-${GITHUB_RUN_NUMBER}"
          NOTES="APK قابل للتثبيت — SCAN ${VERSION} (debug, signed v2). minSdk 26 · targetSdk 35.
          SHA-256: $(cut -d' ' -f1 scan/dist/sha256.txt)
          البناء: commit ${GITHUB_SHA:0:7} · التحليل مساعد وليس إثباتًا نهائيًا، وقد يخطئ."
          gh release create "$TAG" "$APK" \
            --title "SCAN ${VERSION} — APK #${GITHUB_RUN_NUMBER}" \
            --notes "$NOTES" \
            --target "${GITHUB_SHA}" \
            || echo "release upload skipped (non-fatal)"
          gh release view "$TAG" --json url,assets -q '.url' || true

      - name: Fail the job if compilation failed
        if: steps.build.outcome == 'failure'
        run: exit 1
